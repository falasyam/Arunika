# Project-wide Gradle settings.

# AndroidX support
android.useAndroidX=true

# Enables Kotlin kapt incremental compilation.
kapt.use.worker.api=true

# Enables parallel builds.
org.gradle.parallel=true

# Gives Gradle a bigger heap to work with for large projects.
org.gradle.jvmargs=-Xmx4096m -Xms1024m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable Gradle configuration cache (speeds up repeated builds).
org.gradle.configuration-cache=false

# Enable AndroidX Jetifier (migrates legacy support libs automatically).
android.enableJetifier=true

# Non-transitive R classes to reduce resource conflicts.
android.nonTransitiveRClass=true
