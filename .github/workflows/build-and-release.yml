name: Auto Build APK & Release

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build Android APK & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: ☕ Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🔧 Set up Android NDK & CMake
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: 🐘 Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: 🔨 Grant Executable Permission to Gradlew
        run: chmod +x gradlew

      - name: 🚀 Build APK with Gradle
        run: ./gradlew assembleDebug --stacktrace

      - name: 📦 Prepare Release Artifacts & Dynamic Changelog
        id: prepare_apk
        run: |
          BUILD_NUM=${{ github.run_number }}
          RELEASE_TAG="v1.0.0-build.${BUILD_NUM}"
          APK_NAME="Arunika-${RELEASE_TAG}.apk"
          
          # Copy and rename debug APK for release
          cp app/build/outputs/apk/debug/app-debug.apk "${APK_NAME}"
          
          echo "tag=${RELEASE_TAG}" >> $GITHUB_OUTPUT
          echo "apk_name=${APK_NAME}" >> $GITHUB_OUTPUT
          echo "size=$(stat -c%s "${APK_NAME}")" >> $GITHUB_OUTPUT

          # Buat dynamic release body markdown dengan detail perubahan baru
          cat << 'EOF' > release_body.md
          ## 🎬 Arunika — Automated Build (${{ github.run_number }})

          **Commit:** [`${{ github.sha }}`](https://github.com/${{ github.repository }}/commit/${{ github.sha }}) | **Branch:** `${{ github.ref_name }}`

          ### 📌 Ringkasan Komit Terbaru:
          EOF

          # Pesan komit terbaru
          git log -1 --pretty=format:"**%s**%n%n%b" ${{ github.sha }} >> release_body.md
          echo "" >> release_body.md
          echo "" >> release_body.md

          # Riwayat perubahan sejak rilis sebelumnya atau komit terakhir
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "### 🔄 Perubahan Baru Sejak $PREV_TAG:" >> release_body.md
            git log ${PREV_TAG}..HEAD --no-merges --pretty=format:"- **%s** ([%h](https://github.com/${{ github.repository }}/commit/%H)) - _@%an_" >> release_body.md
          else
            echo "### 🔄 Riwayat Perubahan Terbaru:" >> release_body.md
            git log -n 10 --no-merges --pretty=format:"- **%s** ([%h](https://github.com/${{ github.repository }}/commit/%H)) - _@%an_" >> release_body.md
          fi
          echo "" >> release_body.md
          echo "" >> release_body.md

          cat << 'EOF' >> release_body.md
          ### 📁 Berkas yang Dimodifikasi pada Komit Ini:
          ```diff
          EOF
          git diff-tree --no-commit-id --name-status -r ${{ github.sha }} >> release_body.md
          cat << 'EOF' >> release_body.md
          ```

          ### 📲 Unduh & Pasang:
          Unduh file installer **`${{ steps.prepare_apk.outputs.apk_name }}`** di bawah ini dan pasang di perangkat Android Anda (Android 8.0+ / API 26+).
          EOF

      - name: 📤 Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.prepare_apk.outputs.apk_name }}
          path: ${{ steps.prepare_apk.outputs.apk_name }}
          retention-days: 14

      - name: 🌟 Create Automated GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prepare_apk.outputs.tag }}
          name: "Arunika Release ${{ steps.prepare_apk.outputs.tag }}"
          body_path: release_body.md
          generate_release_notes: true
          files: ${{ steps.prepare_apk.outputs.apk_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
